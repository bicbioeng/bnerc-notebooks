name: Run notebooks

# Executes every notebook top to bottom with its default RECORDS, as root on
# Linux like Colab, and fails on any error or failed download.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    container: python:3.11-bookworm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        notebook: [comparative-genomics, pangenome, geo-expression]
    steps:
      - uses: actions/checkout@v4
      - name: Notebooks are up to date with build.py
        run: python build.py && git config --global --add safe.directory "$PWD" && git diff --exit-code -- '*.ipynb'
      - name: Jupyter
        run: apt-get -qq update && apt-get -qq install -y bzip2 curl wget > /dev/null && pip -q install nbconvert ipykernel
      - name: Run ${{ matrix.notebook }}
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=3000 ${{ matrix.notebook }}.ipynb --output /tmp/out.ipynb
      - name: No failed downloads
        run: |
          python - <<'PY'
          import json
          nb = json.load(open("/tmp/out.ipynb"))
          text = "".join(o.get("text", "") if isinstance(o.get("text", ""), str) else "".join(o["text"])
                         for c in nb["cells"] for o in c.get("outputs", []))
          assert "❌" not in text and "Not downloaded" not in text, text[-3000:]
          print("ok")
          PY
